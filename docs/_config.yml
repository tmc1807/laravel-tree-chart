# laravel-tree-chart docs
title: laravel-tree-chart
description: Diagram struktur pohon untuk Laravel Blade yang framework-agnostic
remote_theme: just-the-docs/just-the-docs
color_scheme: light

url: https://tmc1807.github.io/laravel-tree-chart

# just-the-docs configuration
aux_links:
  "laravel-tree-chart di GitHub":
    - "https://github.com/tmc1807/laravel-tree-chart"
aux_links_new_tab: true
search_enabled: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Exclude build artifacts from the Jekyll build.
exclude:
  - .git
  - vendor
  - node_modules
  - Gemfile
  - Gemfile.lock
  - _site
